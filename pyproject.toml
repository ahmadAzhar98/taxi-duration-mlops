[project]
name = "taxi-mlops"
version = "0.1.0"
description = "End-to-end MLOps pipeline for NYC Yellow Taxi trip-duration prediction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "pydantic-settings>=2.2",
    "pandera>=0.34.1",
    "feast[aws]>=0.67.0",
    "s3fs>=2026.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_mlops"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
