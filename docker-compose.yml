services:
  rustfs:
    # S3-compatible object storage (open-source MinIO alternative)
    image: rustfs/rustfs:1.0.2
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    # Host ports shifted off 9000, which PHP-FPM commonly occupies on macOS
    ports:
      - "9010:9000" # S3 API
      - "9011:9001" # web console
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  create-buckets:
    image: amazon/aws-cli:2.38.1
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "
      for b in raw processed features; do
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $$b 2>/dev/null ||
        aws --endpoint-url http://rustfs:9000 s3 mb s3://$$b;
      done
      "

volumes:
  rustfs-data:
